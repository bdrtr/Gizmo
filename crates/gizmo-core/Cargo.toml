[package]
name = "gizmo-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# Optional `bevy_reflect` integration. When OFF (the default), `bevy_reflect`
# does not appear anywhere in this crate's public API — a hard requirement for a
# stable 1.0 surface. When ON, components can be registered for reflection-based
# (de)serialization via `ComponentRegistry::register_reflect`.
reflect = ["dep:bevy_reflect"]

# Optional `tracing-subscriber` integration: `GizmoTracingLayer` (an impl of
# `tracing_subscriber::Layer`) plus the `init_tracing()` helper that installs it, which
# together forward `tracing` events into this crate's in-memory log buffer.
#
# Default-OFF for the same reason as `reflect`, and note that the unconditional `tracing`
# dependency is NOT the same situation. `tracing` 0.1 has been frozen since 2019 and none of
# its API — `info!`, `#[instrument]` — leaves a `tracing` type in any signature of ours, so it
# costs the 1.0 contract nothing. `tracing-subscriber` 0.3 still moves, and the integration is
# a trait impl of *its* trait on *our* public type; a trait impl cannot be hidden (the point
# of the layer is to be passed to `registry().with(..)`), so it sits on our public surface
# exactly as a public field would, and a `tracing-subscriber` 0.4 would force a gizmo-core
# 2.0. Gating the subscriber and not the facade is the whole distinction.
tracing-layer = ["dep:tracing-subscriber"]

[dependencies]
# `glam` feature provides the `Reflect`/`FromReflect`/`Typed` impls for the glam
# math types (Vec3/Quat/...) that our reflected components embed. It was
# previously pulled in transitively via `bevy_math`; now that `gizmo-math` no
# longer depends on `bevy_math`, the `reflect` feature enables it explicitly.
bevy_reflect = { version = "0.19", features = ["functions", "glam"], optional = true }
crossbeam-queue = "0.3.12"
ron = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
uuid = { version = "1.23.0", features = ["v4", "serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = "0.4.44"
# rayon needs OS threads → native only; wasm uses `parallel_compat` (sequential).
rayon = "1.11.0"

[dev-dependencies]
chacha20 = "0.10.0"
criterion = "0.8.2"
rand = "0.10.1"
bevy_tasks = "0.15"
proptest = { workspace = true }

[[bench]]
name = "ecs_bench"
harness = false
path = "benches/ecs_bench/main.rs"

[[bench]]
name = "reflect_bench"
harness = false
required-features = ["reflect"]

[[bench]]
name = "map_bench"
harness = false
required-features = ["reflect"]

[[bench]]
name = "path_bench"
harness = false
required-features = ["reflect"]

[[bench]]
name = "struct_bench"
harness = false
required-features = ["reflect"]

[[bench]]
name = "par_iter_bench"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
# uuid v4 needs a randomness source on wasm; the `js` feature routes it through
# the browser crypto API. Unions with the base ["v4", "serde"] features.
uuid = { version = "1.23.0", features = ["js"] }
