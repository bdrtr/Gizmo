[package]
name = "gizmo-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Deliberately NOT `description.workspace = true`. The workspace description
# ("A custom ECS and physics engine...") would let a crates.io visitor assume
# this is a usable UI toolkit. It is not: the crate computes taffy layout and
# pointer hit-testing and emits no vertices or draw calls, and the engine has no
# text rendering at all. This string is the first thing crates.io shows, so it
# is the right place to say so. See README.md / the crate-level docs.
description = "EXPERIMENTAL: flexbox/grid UI layout (taffy) and pointer hit-testing for the Gizmo engine's ECS. Computes box geometry and hover/press state only — it renders nothing, and there is no text rendering yet."
license.workspace = true
repository.workspace = true
# Crate-local, unlike the other crates' `readme.workspace = true` (which resolves
# to the workspace root README): the experimental status needs to be on this
# crate's own crates.io page, not buried in the engine-wide one.
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Optional: only the `UiPlugin` convenience wrapper needs the app framework.
# The dependency-light `register(world, schedule)` entry point needs only
# gizmo-core, so gizmo-ui is usable as a pure ECS-UI layer without gizmo-app.
gizmo-app = { version = "0.9.0", path = "../gizmo-app", default-features = false, optional = true }
gizmo-core = { version = "0.9.0", path = "../gizmo-core" }
gizmo-math = { path = "../gizmo-math", version = "0.9.0" }
# `calc` KASITLI OLARAK KAPALI (taffy'nin varsayılanında açıktır).
# taffy'nin `CompactLength`'i 64-bit'te tag+değer+pointer'ı tek bir `*const ()`
# içine paketler → `taffy::Style` yapısal olarak `!Send + !Sync`. Ama pointer
# varyantını üreten TEK public constructor `CompactLength::calc`'tır ve o
# `#[cfg(feature = "calc")]` ile kapılıdır. Feature kapalıyken union yalnızca
# f32+tag taşıyabilir (ham veri) → `Style`/`UiContext` için elle yazılan
# `unsafe impl Send/Sync` KANITLANABİLİR olur. Bkz. components.rs / layout.rs.
# Bu satırı `calc` ekleyerek geri açarsan o iki impl unsound olur.
taffy = { version = "0.10.1", default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "grid",
    "block_layout",
    "float_layout",
    "content_size",
    "detailed_layout_info",
] }

[features]
default = []
app = ["dep:gizmo-app"]
