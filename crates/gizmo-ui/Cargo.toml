[package]
name = "gizmo-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Deliberately NOT `description.workspace = true`. The workspace description
# ("A custom ECS and physics engine...") would let a crates.io visitor assume
# this is a usable UI toolkit. It is not: the crate computes taffy layout and
# pointer hit-testing and emits no vertices or draw calls, and the engine has no
# text rendering at all. This string is the first thing crates.io shows, so it
# is the right place to say so. See README.md / the crate-level docs.
description = "EXPERIMENTAL: flexbox UI layout and pointer hit-testing for the Gizmo engine's ECS. Computes box geometry and hover/press state only — it renders nothing, and there is no text rendering yet."
license.workspace = true
repository.workspace = true
# Crate-local, unlike the other crates' `readme.workspace = true` (which resolves
# to the workspace root README): the experimental status needs to be on this
# crate's own crates.io page, not buried in the engine-wide one.
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Optional: only the `UiPlugin` convenience wrapper needs the app framework.
# The dependency-light `register(world, schedule)` entry point needs only
# gizmo-core, so gizmo-ui is usable as a pure ECS-UI layer without gizmo-app.
gizmo-app = { version = "0.10.0", path = "../gizmo-app", default-features = false, optional = true }
gizmo-core = { version = "0.10.0", path = "../gizmo-core" }
gizmo-math = { path = "../gizmo-math", version = "0.10.0" }
# taffy bir İMPLEMENTASYON DETAYIDIR: public API'de hiçbir taffy tipi görünmez.
# `Style` artık kendi POD tipimiz (components.rs); taffy'ye çeviri yalnızca
# `UiContext::to_taffy_style` içinde yapılır (layout.rs). A3-followup, 2026-08-08.
#
# `calc` KASITLI OLARAK KAPALI. (0.10'da taffy'nin VARSAYILANINDA açıktı; 0.13'te
# artık varsayılan değil — yani feature-birleştirme riski küçüldü ama kaybolmadı,
# graftaki başka bir crate onu hâlâ açıkça isteyebilir. 2026-08-17'de doğrulandı.) taffy'nin
# `CompactLength`'i 64-bit'te tag+değer+pointer'ı tek bir `*const ()` içine
# paketler → `taffy::Style` yapısal olarak `!Send + !Sync`, dolayısıyla onu
# barındıran `TaffyTree`, yani `UiContext`, de öyle. `UiContext`'teki iki
# `unsafe impl` bu yüzden DURUYOR — ama artık bu feature satırına DEĞİL, kendi
# çevirimize dayanıyor: `to_taffy_style` sadece `length/percent/auto` üretir,
# `calc()` üretmez, ve public `Val` tipinde calc varyantı yoktur. Yani feature
# birleştirmesi `calc`'ı açsa bile ağaçtaki hiçbir değer pointer taşıyamaz
# (`no_length_conversion_produces_a_calc_tagged_value` testi bunu doğrular).
# Feature'ı yine de kapalı tutuyoruz: derlenmeyen kod yanlışlıkla çağrılamaz.
#
# `grid` açık ama `Style` grid'i modellemiyor (bkz. Style dokümanındaki "Not
# modelled" listesi) — grid'i geri açmak isteyen önce bir track tipi tanımlamalı.
taffy = { version = "0.13.0", default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "grid",
    "block_layout",
    "float_layout",
    "content_size",
    "detailed_layout_info",
] }

[features]
default = []
app = ["dep:gizmo-app"]
