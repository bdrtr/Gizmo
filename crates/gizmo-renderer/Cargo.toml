[package]
name = "gizmo-renderer"
version.workspace = true
edition.workspace = true

authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
wgpu = { version = "30", features = ["fragile-send-sync-non-atomic-wasm", "webgl"] }
# Shader module composition (#import / #define) so shared structs (SceneUniforms,
# LightData) and BRDF helpers live in one common.wgsl instead of being hand-copied into
# 20+ shaders. We compose to a naga::Module then emit WGSL text (wgpu 29 lacks the
# `naga-ir` feature and the WASM path still post-processes WGSL text), so `naga` is a
# direct dep pinned to the same 29.x wgpu uses, with the WGSL front/back ends enabled.
naga_oil = "0.23"
naga = { version = "30", features = ["wgsl-in", "wgsl-out"] }
log = "0.4"
pollster = "1.0"
winit = { workspace = true }
bytemuck = { version = "1.14", features = ["derive"] }
gizmo-math = { path = "../gizmo-math" , version = "0.10.0" }
gizmo-core = { path = "../gizmo-core" , version = "0.10.0" }
gizmo-animation = { path = "../gizmo-animation", version = "0.10.0", default-features = false }
tobj = "4.0.3"
image = { version = "0.25", features = ["webp"] }
serde = { version = "1.0.228", features = ["derive"] }
gltf = { version = "1.4.1", features = ["import", "extensions", "KHR_materials_emissive_strength", "KHR_texture_transform"] }
notify = "8"
rand = "0.10.0"
uuid = { version = "1.23.0", features = ["v4", "serde"] }
ron = "0.12.1"
tracing = "0.1.44"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
meshopt = "0.6.2"


[dev-dependencies]
pollster = "1.0"
criterion = "0.8.2"

# CPU-only: builds `Frustum`/`Aabb`/`Mat4` scenes and runs the cull, no wgpu adapter.
[[bench]]
name = "visibility_bench"
harness = false

# CPU-only: `assign_lights` is a pure function of the grid, the camera and the light list.
# ENGINE.md §3 hangs "move it to a compute shader" on a profile of exactly this, and until
# 2026-08-18 nothing could produce one.
[[bench]]
name = "clustered_bench"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response"] }
# TWO getrandom majors, and both need the wasm backend turned on explicitly.
#
# 0.3 arrives through `ahash` and `rand_core` 0.9; 0.4 through this crate's own `rand` 0.10.
# The `getrandom_backend="wasm_js"` cfg in `.cargo/config.toml` covers 0.3 on its own — 0.4
# made it a crate FEATURE as well, and a version that has one but not the other stops the wasm
# build dead with `compile_error!`.
#
# This entry said only "0.3" until 2026-08-16, which is how the wasm gate went red: building
# `-p gizmo-renderer` alone (exactly what CI does) had nothing enabling 0.4's feature, while
# building `-p demo-web` did — so a local check on demo-web passed and CI did not.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1.23.0", features = ["v4", "serde", "js"] }
web-time = "1"
