[package]
name = "gizmo-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
gizmo-core = { path = "../gizmo-core" , version = "0.10.0" }
gizmo-math = { path = "../gizmo-math" , version = "0.10.0" }
tracing = "0.1.44"

# Optional dependencies
gizmo-physics-core = { path = "../gizmo-physics-core", version = "0.10.0", optional = true }
gizmo-physics-rigid = { path = "../gizmo-physics-rigid", version = "0.10.0", optional = true }
gizmo-physics-dynamics = { path = "../gizmo-physics-dynamics", version = "0.10.0", optional = true }
gizmo-renderer = { path = "../gizmo-renderer" , version = "0.10.0", optional = true }
gizmo-audio = { path = "../gizmo-audio" , version = "0.10.0", optional = true }
gizmo-editor = { path = "../gizmo-editor" , version = "0.10.0", optional = true }
gizmo-scene = { path = "../gizmo-scene" , version = "0.10.0", optional = true }
gizmo-net = { path = "../gizmo-net", version = "0.10.0", optional = true, default-features = false }
winit = { version = "0.30", optional = true }
wgpu = { version = "30", features = ["fragile-send-sync-non-atomic-wasm", "webgl"], optional = true }
pollster = { version = "0.4", optional = true }
egui = { version = "0.36", optional = true }
egui-winit = { version = "0.36", default-features = false, features = ["links"], optional = true }
egui-wgpu = { version = "0.36", optional = true }
image = { version = "0.25", optional = true }

[features]
default = ["window", "render", "audio", "physics", "scene", "editor", "network", "gamepad"]
headless = ["physics", "network"]
network = ["dep:gizmo-net", "gizmo-net/rollback"]
window = ["dep:winit"]
render = ["dep:wgpu", "dep:gizmo-renderer", "dep:pollster", "dep:image", "window"]
audio = ["dep:gizmo-audio"]
physics = ["dep:gizmo-physics-core", "dep:gizmo-physics-rigid", "dep:gizmo-physics-dynamics"]
# `egui` is the immediate-mode overlay UI layer (the egui runtime + `set_ui`
# hook + dev console). It does NOT pull in the editor crate, so a game can use
# an egui HUD without the full editor.
egui = ["dep:egui", "dep:egui-winit", "dep:egui-wgpu", "render"]
# `editor` is the full in-engine editor (EditorState, scene/game viewport RTT
# management, scene save/load). It is layered on top of `egui`, and needs
# `scene` for its save/load request handling.
editor = ["egui", "scene", "dep:gizmo-editor"]
scene = ["dep:gizmo-scene", "dep:gizmo-scripting"]
# Physical game controllers, through gilrs — on every target, including the browser.
#
# It WAS target-gated off wasm32, on the grounds that "browsers expose gamepads through a
# different, polled API that is not wired yet". gilrs wires it: its wasm backend reads the Web
# Gamepad API through web-sys and turns the browser's polled snapshot into the same event stream
# the native backends produce, so the engine's side is identical on both.
#
# It is on by default because a controller that does nothing until the developer finds a
# feature flag is indistinguishable from one that is broken. Off, the engine builds without
# gilrs and without its libudev link on Linux, which is what a headless server wants.
gamepad = ["dep:gilrs"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17.2"
backtrace = "0.3.76"
# Default features on purpose: gilrs's default is `wgi` (Windows.Gaming.Input), and with BOTH
# `wgi` and `xinput` off its platform module raises a `compile_error!` — one that is not gated on
# Windows, so `default-features = false` breaks the build on every OS.
gilrs = { version = "0.11.2", optional = true }
# Pulled in by `scene` so the runtime can register the `Script` scene component
# (gizmo-scene itself no longer depends on scripting — keeps scene GPU-free).
# Target-gated: mlua (C Lua) cannot build for wasm32-unknown-unknown, so on the
# web the `scene` feature loads scenes without Script components (scripting is
# part of the deferred web backlog). `dep:gizmo-scripting` in the `scene`
# feature is a no-op on wasm32.
gizmo-scripting = { path = "../gizmo-scripting" , version = "0.10.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's gamepads, through gilrs's wasm backend (web-sys + the Web Gamepad API).
#
# Default features, for the same reason as the native entry and verified the hard way: gilrs's
# `compile_error!` about `xinput`/`wgi` is NOT gated on Windows, so `default-features = false`
# fails on wasm32 too — the comment above already said so, and trying it anyway is how that got
# re-confirmed. The Windows backends are simply unused here.
gilrs = { version = "0.11.2", optional = true }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
console_log = "1.0"
js-sys = "0.3"
log = "0.4"
tracing-wasm = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Node",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "HtmlElement",
] }
web-time = "1"

[dev-dependencies]
# Test-only: the scene-registry tests derive Serialize on a stand-in user component.
serde = { version = "1", features = ["derive"] }
