[package]
name = "gizmo-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `tracing-layer`: studio calls `logger::init_tracing()` in `main`, and that helper lives
# behind gizmo-core's default-off subscriber feature (see its manifest). Without it the editor
# console would only show `gizmo_log!` records, not `tracing` events.
gizmo = { package = "gizmo-engine", path = "../gizmo", features = ["editor", "scene", "audio", "scripting", "tracing-layer"] , version = "0.11.0" }
mimalloc = { workspace = true }
tracing = "0.1.44"
# The export reads cargo's JSON messages to find the runtime it built (`systems::build::compile`).
# Already in the graph through the engine, at this version. The tests build game components' JSON
# edits with `json!` from it too.
serde_json = "1.0"

[dev-dependencies]
# The window-icon test decodes the embedded logo the same way the runtime does. `image` is not a
# normal dependency here — the app never touches it directly, `gizmo-app` does — so it is a
# dev-dependency rather than a new edge in the shipped binary.
image = "0.25"
# The editor pixel tests drive the real pipeline on a headless device; `Renderer::new_headless`
# is async and there is no runtime in a test binary.
pollster = "1.0"
# A game component in a test has to derive `Serialize`/`Deserialize` to be registered with the
# editor — the crate the engine's own registry is written against. Test-only, like the two above.
serde = { version = "1.0", features = ["derive"] }
# Tests that build a `Mesh` (wgpu buffers) with no GPU, on the noop backend — they run in CI. The
# engine's `wgpu` with one more backend turned on; the shipped binary's graph is unchanged.
wgpu = { version = "30", default-features = false, features = ["noop", "wgsl"] }
