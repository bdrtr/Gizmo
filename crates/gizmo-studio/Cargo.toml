[package]
name = "gizmo-studio"
version.workspace = true
edition.workspace = true
publish = false

authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `tracing-layer`: studio calls `logger::init_tracing()` in `main`, and that helper lives
# behind gizmo-core's default-off subscriber feature (see its manifest). Without it the editor
# console would only show `gizmo_log!` records, not `tracing` events.
gizmo = { package = "gizmo-engine", path = "../gizmo", features = ["editor", "scene", "audio", "scripting", "tracing-layer"] , version = "0.9.0" }
rand = "0.9.0"
mimalloc = { workspace = true }
tracing = "0.1.44"
