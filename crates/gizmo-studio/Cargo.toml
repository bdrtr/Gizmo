[package]
name = "gizmo-studio"
version.workspace = true
edition.workspace = true
publish = false

authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# `tracing-layer`: studio calls `logger::init_tracing()` in `main`, and that helper lives
# behind gizmo-core's default-off subscriber feature (see its manifest). Without it the editor
# console would only show `gizmo_log!` records, not `tracing` events.
gizmo = { package = "gizmo-engine", path = "../gizmo", features = ["editor", "scene", "audio", "scripting", "tracing-layer"] , version = "0.10.0" }
# NOT the workspace version. This got caught twice by a blanket version bump whose "is this a
# gizmo crate?" check matched the FILENAME (which contains "gizmo") instead of the dependency
# name, so every line in every gizmo-*/Cargo.toml looked like ours. 0.9.0 -> 0.9.1 was harmless;
# 0.9.1 -> 0.10.0 silently asked for a rand major that removed `random_range`.
rand = "0.10.1"
mimalloc = { workspace = true }
tracing = "0.1.44"

[dev-dependencies]
# The window-icon test decodes the embedded logo the same way the runtime does. `image` is not a
# normal dependency here — the app never touches it directly, `gizmo-app` does — so it is a
# dev-dependency rather than a new edge in the shipped binary.
image = "0.25"
# The editor pixel tests drive the real pipeline on a headless device; `Renderer::new_headless`
# is async and there is no runtime in a test binary.
pollster = "0.3"
