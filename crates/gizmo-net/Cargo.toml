[package]
name = "gizmo-net"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = []
# renet tabanlı otoriter sunuculu mimari (prediction + interpolation dahil)
client-server = ["dep:renet", "dep:renet_netcode"]
# P2P deterministik rollback (fizik snapshot capture/restore)
rollback = [
    "dep:gizmo-core",
    "dep:gizmo-math",
    "dep:gizmo-physics-core",
    "dep:gizmo-physics-rigid",
]

[dependencies]
# Ortak (her iki mimari de kullanır)
# 2.x, not 1.x: bincode 1 is unmaintained and was this crate's only direct `cargo deny`
# advisory (FIXPLAN A6-followup). The wire format is preserved exactly — see
# `rollback::transport::encode_packet`, which pins `config::legacy()`, and `tests/wire_format.rs`,
# whose expected bytes were captured from 1.3.3 before the swap.
bincode = { version = "2", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"

# client-server backend
renet = { version = "2.0.0", optional = true }
renet_netcode = { version = "2.0.0", optional = true }

# rollback backend
gizmo-core = { version = "0.9.1", path = "../gizmo-core", optional = true }
gizmo-math = { version = "0.9.1", path = "../gizmo-math", optional = true }
gizmo-physics-core = { version = "0.9.1", path = "../gizmo-physics-core", optional = true }
gizmo-physics-rigid = { version = "0.9.1", path = "../gizmo-physics-rigid", optional = true }

[[example]]
name = "p2p_rollback_test"
required-features = ["rollback"]
