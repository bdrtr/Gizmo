[package]
name = "gizmo-ai"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
gizmo-math = { path = "../gizmo-math" , version = "0.10.0" }
gizmo-core = { path = "../gizmo-core" , version = "0.10.0" }
gizmo-physics-core = { path = "../gizmo-physics-core" , version = "0.10.0" }
gizmo-physics-rigid = { path = "../gizmo-physics-rigid" , version = "0.10.0" }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1.44"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
# Only for the scene-persistence tests: what a NavAgent writes into a scene file and what it
# refuses to. The crate itself has no serde format of its own.
serde_json = "1.0.149"
