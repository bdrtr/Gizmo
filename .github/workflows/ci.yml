name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Cross-platform build + test (471+ tests) ──────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Every job carries a timeout. Without one a hang runs to GitHub's 6-hour default, and one
    # did: fixing the D3D12 shader error let the Windows GPU tests get *past* pipeline creation
    # and start actually rendering — on a runner whose adapter is WARP, software-rasterising a
    # 3072² × 4 shadow-map array. It was still going at 5.5 hours against ubuntu's 6 minutes.
    # A timeout does not fix that; it turns it into a report instead of a burnt runner.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --workspace --verbose
      # `--no-fail-fast` so a red run reports EVERYTHING that is red. Without it cargo stops
      # launching test binaries at the first failure, and this workspace has 159 of them —
      # measured locally on 2026-08-19, where one standing failure was hiding 29, `gizmo-studio`'s
      # whole integration suite among them. On CI the same mechanism turns "one test failed" into
      # a report that may be missing the other nine.
      - name: Test (workspace, default features)
        run: cargo test --locked --workspace --no-fail-fast --verbose
      - name: Test gizmo-net (feature-gated backends)
        run: cargo test --locked -p gizmo-net --no-fail-fast --features client-server,rollback

  # ── Lint: rustfmt (report-only) + clippy (-D warnings, ratcheted) ─────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      # Report-only: kod tabanı henüz tam rustfmt uyumlu değil (kademeli temizlenecek).
      - name: Rustfmt check (report-only)
        run: cargo fmt --all --check
        continue-on-error: true
      # `-D warnings` gerçek bir kapıdır. Mevcut (grandfather'lı) lint'ler `-A` ile
      # muaf tutulur — bu bir RATCHET: YENİ lint türleri CI'yı kırar, mevcut backlog
      # zamanla temizlendikçe ilgili `-A` satırı kaldırılır.
      #
      # 2026-06-12: backlog temizliği — 17 muaf lint → 2'ye indi (bkz. git log).
      # Kalan ikisi mimari: `too_many_arguments`/`type_complexity` fonksiyon
      # imzalarını struct'a sarmadan refactor edilemez, ayrı bir iş. Tek meşru
      # `needless_range_loop` istisnası (determinizm-kritik PGS solver) global
      # `-A` yerine solver.rs'te yerel `#[allow]` + gerekçeyle dokümante edildi.
      #
      # 2026-07-01: `--all-features --all-targets`'a sıkılaştırıldı — test + bench
      # + tüm-feature yüzeyi de artık kapının içinde (önceki test/bench backlog'u
      # temizlendi: benchmark payload'larına dosya-içi dead_code allow, test
      # modüllerine hedefli field_reassign allow, gerisi gerçek düzeltme).
      - name: Clippy (-D warnings, ratcheted, all-features + all-targets)
        run: |
          cargo clippy --locked --workspace --all-features --all-targets -- -D warnings \
            -A clippy::too_many_arguments -A clippy::type_complexity

  # ── Optional features: the `reflect` path must build + test (ubuntu only) ──
  features:
    name: Features (reflect)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Test Stage A crates with `reflect`
        run: cargo test --locked -p gizmo-core -p gizmo-physics-core -p gizmo-physics-rigid -p gizmo-scene --features reflect
      # `tracing-layer` is gizmo-core's other default-off seal (the `tracing_subscriber::Layer`
      # impl), and it needs BOTH halves run here, in this job, on purpose.
      #
      # The negative half — a `compile_fail` doc-test emitted only under
      # `not(feature = "tracing-layer")` — cannot be proved by the `test` job. That job runs
      # `cargo test --workspace`, and `gizmo-studio` is a workspace member that enables
      # `gizmo-engine/tracing-layer`; resolver-v2 feature unification therefore compiles
      # gizmo-core WITH the feature there, and the doc-test does not exist in that build. The
      # `lint` job is `--all-features`, so it cannot prove it either. Only a package-scoped
      # invocation that excludes gizmo-studio sees the default surface — hence this step.
      - name: Test gizmo-core at DEFAULT features (proves the subscriber bridge is absent)
        run: cargo test --locked -p gizmo-core
      # The positive half: with the feature on, the layer must still build and still forward
      # events (this is what catches a `#[cfg]` placed so that the type survives but the
      # `Layer` impl does not).
      - name: Test gizmo-core with `tracing-layer` (subscriber bridge, off by default)
        run: cargo test --locked -p gizmo-core --features tracing-layer
      - name: Test experimental multibody (ABA) — opt-in, off by default
        run: cargo test --locked -p gizmo-physics-rigid --features experimental-multibody
      # `gizmo-analysis/app` is the plugin that wires the collector into an App's schedules, and
      # NOTHING enables it in a plain workspace build: only `gizmo-engine/analysis` turns it on, and
      # no member asks for that. Measured — a guard added inside `plugin.rs` did not appear in
      # `cargo test --workspace` output at all. The `lint` job is `--all-features`, so it compiles
      # these tests but never runs them. This step is the only place they run.
      - name: Test gizmo-analysis with `app` (plugin wiring, off by default)
        run: cargo test --locked -p gizmo-analysis --features app

  # ── Feature composition: every feature combination of the two entry crates must build ──
  # A workspace build only ever exercises the DEFAULT feature set, which is how the facade
  # ended up in a state where `--features headless` — an advertised, documented config —
  # failed with 37 errors, and where NO non-default combination compiled at all. The cause
  # was unconditional `pub mod`s whose bodies used the optional renderer/physics deps, plus
  # a non-additive `window` feature in gizmo-app that *deleted* `headless::App`.
  #
  # `cargo hack --feature-powerset` builds the combinations directly. Depth 2 (every pair)
  # is the sweet spot: it catches "feature A alone" and "A+B interact" without the
  # exponential blowup of the full powerset on a 15-feature crate.
  # Two crates, two runners (2026-08-18), and the reason is `fail-fast`, not speed: sequentially,
  # `gizmo-app` failing stops the run before `gizmo-engine` is linted at all — the same blindness
  # `cargo hack --keep-going` exists to remove one level down. `matrix` rather than two copies so
  # the setup cannot drift between them.
  #
  # Cost, measured on CI and not guessed: the whole job — both crates, ~200 combinations, no cached
  # clippy artifacts — took **7 min 3 s** on the run that introduced the clippy flip, and 7 min 19 s
  # on the next. (Two later runs sat at 35+ minutes and looked like this gate's fault; they were
  # parked in `Install Linux dependencies`, an apt-get that never returned. See docs/ENGINE.md §8.)
  feature-powerset:
    name: Feature powerset (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        crate: [gizmo-engine, gizmo-app]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # This job needs more than the others. The feature powerset turns on `window`, which pulls
      # winit's Linux backends in, and `wayland-sys`' build script fails outright when pkg-config
      # cannot find libwayland — "failed to run custom build command", with no mention of a
      # missing package. Every other job builds a feature set that never reaches winit, which is
      # why only this one needed them.
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
          libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      # No `--locked` here on purpose: `--no-dev-deps` rewrites the manifest to drop
      # dev-dependencies, which changes resolution and therefore needs to touch the lock
      # file — the two flags are mutually exclusive and `--locked` wins with a hard error.
      # Reproducibility is already enforced by every other job; this one is a compile
      # matrix. `--no-dev-deps` stays because it keeps 39 combinations from each rebuilding
      # the bevy dev-dependency stack.
      # `clippy -D warnings`, not `check`, since 2026-08-18 — and the reason is the wasm job's,
      # one axis over. The lint config is crate-wide (`#![warn(missing_docs)]`, `-D warnings`) but
      # WHICH CODE EXISTS is per-feature, and the lint job runs `--all-features`, so an import or
      # a static that is only reachable under a smaller feature set was outside every gate. This
      # job was already building those sets and throwing the warnings away: measured, **66 of the
      # facade's 150 combinations** failed `-D warnings` the first time it was asked — ten defects
      # in two files, each repeated across the combinations that expose it, including a `#[cfg]`
      # sitting on the line below the import it was meant to gate.
      #
      # The steady-state cost is 20 %: 49 s → 59 s over the facade's 150 combinations with
      # dependencies cached. The cold run is the one that needed the split above.
      - name: ${{ matrix.crate }} — every feature pair must compile AND lint
        run: cargo hack clippy -p ${{ matrix.crate }} --feature-powerset --depth 2 --no-dev-deps
          -- -D warnings -A clippy::too_many_arguments -A clippy::type_complexity

  # ── Supply chain: advisories, licences, sources ───────────────────────────
  # The workspace publishes 19 crates and had no supply-chain tooling at all until
  # 2026-08. The first run found six advisories (one fixed by a lockfile bump, five
  # documented as accepted with reasons in deny.toml) and confirmed that the MPL-2.0
  # code the default `audio` feature pulls in is a real, disclosable exception to the
  # README's flat "MIT OR Apache-2.0".
  #
  # Every exception in deny.toml carries a written justification. New advisories are
  # meant to break this job.
  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny (advisories + licenses + bans + sources)
        run: cargo deny --all-features check

  # ── MSRV gate: workspace must build on the declared rust-version ──────────
  #
  # The toolchain is DERIVED from `rust-version` in Cargo.toml rather than pinned here, and the
  # reason is a hazard this job actually hit. `dtolnay/rust-toolchain` takes the toolchain from its
  # own ref, so the pin read `@1.92.0` — and to Dependabot's github-actions ecosystem that is
  # indistinguishable from an action version. It opened a PR bumping it to `@1.100.0`: not a Rust
  # release at all (stable is 1.97), so the job died in seven seconds at
  # `rustup toolchain install 1.100.0`.
  #
  # The failure was the lucky outcome. Had such a bump ever landed on a version that DOES exist,
  # this job would have gone green while checking a toolchain with no relationship to the declared
  # `rust-version` — an MSRV gate guarding nothing, and nothing anywhere would have said so.
  #
  # Deriving it removes the constant Dependabot can reach. Same answer as `pages.yml`, which reads
  # the wasm-bindgen pin out of `Cargo.lock` so a `cargo update` cannot silently desync CI from the
  # source tree. The job's display name is deliberately version-less: GitHub resolves job names
  # before any step runs, so a name carrying "1.92" would be a second copy of the number, free to
  # drift from the manifest exactly like the pin was.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          ver=$(awk -F'"' '/^rust-version = /{print $2; exit}' Cargo.toml)
          if [ -z "$ver" ]; then
            echo '::error::could not read rust-version from [workspace.package] in Cargo.toml'
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "MSRV gate will build on Rust $ver (from Cargo.toml)"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Check (workspace, MSRV toolchain)
        run: cargo check --locked --workspace

  # ── Determinism & stability: 3× tower collapse, hashes must match ─────────
  determinism:
    name: Determinism & Stability
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Headless stress test (200-box tower, 3 runs, hash match)
        run: cargo run --locked --release -p demo --bin headless_stress_test

  # ── Benchmarks: run every criterion bench ONCE (test mode) ────────────────
  # `cargo bench -- --test` executes each benchmark a single time instead of the
  # slow timing loop — CI-hardware-noise-proof, and it catches what a compile
  # check can't: runtime panics and broken bench assertions. (This gate first
  # surfaced a real engine bug — spawn_batch panicking on SparseSet bundles.)
  # Full timing-regression comparison (critcmp/baselines) is intentionally out of
  # scope: too noisy on shared CI runners.
  benchmarks:
    name: Benchmarks (run-once smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Run all benchmarks once (criterion --test)
        run: cargo bench --locked --workspace --benches -- --test

  # ── WASM: the sim core AND the browser graphics stack must compile to wasm32 ─
  # Locks (a) the deterministic simulation core (math/core/physics/ai/animation/
  # scene), and (b) the WebGPU browser stack: renderer, windowed app runtime and
  # the `demo-web` browser demo (facade with the web feature subset — audio,
  # network, editor and scripting stay native-only for now, see RELEASING §4g).
  # `demo-web` was verified end-to-end in headless Chrome (WebGPU adapter,
  # 90 rendered frames, scene pixels) on 2026-07-02; this gate keeps it building.
  wasm:
    name: WASM (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build simulation core for wasm32
        run: |
          cargo build --locked --target wasm32-unknown-unknown \
            -p gizmo-math -p gizmo-core -p gizmo-physics-core -p gizmo-physics-rigid \
            -p gizmo-physics-soft -p gizmo-ai -p gizmo-animation -p gizmo-scene
      - name: Build browser graphics stack for wasm32 (renderer + app + facade)
        run: |
          cargo build --locked --target wasm32-unknown-unknown -p gizmo-renderer
          cargo build --locked --target wasm32-unknown-unknown -p gizmo-app \
            --no-default-features --features render,physics,scene
          cargo build --locked --target wasm32-unknown-unknown -p demo-web

      # This target was BUILT and never LINTED, and the difference is not academic: the lint
      # config is crate-wide (`deny(missing_docs)`, `-D warnings`) but which code exists is
      # per-target, so every `#[cfg(not(target_arch = "x86_64"))]` arm and every wasm-only branch
      # was outside every gate the project had. It was holding an undocumented public function and
      # a `return` that is needless once the other arm is stripped — neither visible to the native
      # job, both real failures of the rules this repo already set for itself.
      - name: Clippy wasm32 (the arms the native lint job cannot see)
        run: |
          cargo clippy --locked --target wasm32-unknown-unknown \
            -p gizmo-math -p gizmo-core -p gizmo-physics-core -p gizmo-physics-rigid \
            -p gizmo-physics-soft -p gizmo-ai -p gizmo-animation -p gizmo-scene \
            -p gizmo-renderer \
            -- -D warnings -A clippy::too_many_arguments -A clippy::type_complexity
          # `gizmo-editor` is NOT shipped in the browser — `demo-web` does not enable the facade's
          # editor feature. It is linted here anyway because the crate *declares* wasm intent:
          # `gizmo-scripting` is a `cfg(not(target_arch = "wasm32"))` dependency, `web-time`
          # a wasm one, and items are cfg'd accordingly. Nothing compiled that arm, so it rotted:
          # a scripting-only function lost its `cfg` and the crate stopped building for wasm
          # entirely, plus a `let mut` that is dead once the native arm is stripped. Neither was
          # visible to any other job. (2026-08-16)
          cargo clippy --locked --target wasm32-unknown-unknown -p gizmo-editor \
            -- -D warnings -A clippy::too_many_arguments -A clippy::type_complexity
          cargo clippy --locked --target wasm32-unknown-unknown -p gizmo-app \
            --no-default-features --features render,physics,scene \
            -- -D warnings -A clippy::too_many_arguments -A clippy::type_complexity
          # …and again WITH `gamepad`, which became a wasm feature on 2026-08-18. It is a
          # separate invocation rather than another entry in the list above because the line
          # above is the feature set `demo-web` ships and this one is the arm that only exists
          # when the feature is on — the exact shape of gap this job was created for.
          cargo clippy --locked --target wasm32-unknown-unknown -p gizmo-app \
            --no-default-features --features render,physics,scene,gamepad \
            -- -D warnings -A clippy::too_many_arguments -A clippy::type_complexity
          cargo clippy --locked --target wasm32-unknown-unknown -p demo-web \
            -- -D warnings -A clippy::too_many_arguments -A clippy::type_complexity

  # ── Miri: the ECS unsafe surface must be free of undefined behaviour ───────
  # Runs the pointer/aliasing-heavy gizmo-core modules under Miri (Tree Borrows).
  # This fences the archetype-migration disjoint-borrow invariant: taking two
  # `&mut archetypes[i] as *mut` at once was aliasing UB — the fix uses
  # `get_disjoint_mut`, and these tests exercise every migration/swap-remove path.
  # The parallel scheduler is excluded on purpose: its crossbeam-epoch dependency
  # only trips the *experimental* Stacked Borrows model and is not gizmo code.
  miri:
    name: Miri (ECS soundness)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Miri test (ECS unsafe surface, Tree Borrows)
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-tree-borrows -Zmiri-ignore-leaks"
        run: |
          cargo miri test -p gizmo-core --lib world::component_ops
          cargo miri test -p gizmo-core --lib commands::
          cargo miri test -p gizmo-core --lib archetype::tests
          cargo miri test -p gizmo-core --lib archetype::blob
          cargo miri test -p gizmo-core --lib query::tests
          cargo miri test -p gizmo-core --lib hierarchy::tests
          # SparseSet lifecycle: clone_entry's manual alloc/clone_fn/insert, the
          # despawn/bundle sparse routing, and type-erased sparse ptr access
          # (world::tests::*sparse*).
          cargo miri test -p gizmo-core --lib sparse
