[package]
name = "demo-android"
description = "The games as an Android app: an APK built with cargo-apk, one game per APK."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
# Android loads the game as a shared library into a NativeActivity. `lib` as well, so the crate
# also builds (and is linted) on the desktop, where it is empty.
crate-type = ["cdylib", "lib"]

[dependencies]
games = { path = "../games" }
gizmo = { package = "gizmo-engine", path = "../crates/gizmo", default-features = false, features = [
    "window",
    "render",
    "physics",
    "physics-dynamics",
    "ui",
    "audio",
    # An Android app has the system's fonts under /system/fonts, which the engine does not look
    # in; the bundled Noto Sans keeps Turkish letters drawn either way.
    "bundled-font",
] }

[target.'cfg(target_os = "android")'.dependencies]
# The engine logs through `tracing`; with no subscriber, its `log` feature forwards every event to
# `log`, and `android_logger` writes those to logcat (`adb logcat -s gizmo`).
tracing = { version = "0.1", features = ["log"] }
log = "0.4"
android_logger = "0.14"

[package.metadata.android]
package = "com.bdrtr.gizmo.pinbol"
apk_name = "gizmo-pinbol"
build_targets = ["aarch64-linux-android"]
# The launcher icon: `media/logo.png` at the five densities, in `res/mipmap-*/`.
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Gizmo Pinbol"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|uiMode"
