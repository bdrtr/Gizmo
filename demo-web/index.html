  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0d1117; overflow: hidden; }
    /* Motor canvas'ı body'ye kendisi ekler ve %100 boyutlandırır. */
    canvas { display: block; outline: none; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 1.25rem;
      align-items: center; justify-content: center;
      padding: 1rem; text-align: center; color: #8b949e;
      font: 14px system-ui, sans-serif; pointer-events: none; white-space: pre-line;
    }
    /* Sized in rem so it tracks the text rather than a device pixel count, and capped at
       40vmin so it cannot swallow a phone screen. */
    #boot img { width: 8rem; max-width: 40vmin; height: auto; }
    /* The mark is the one thing on screen while a multi-megabyte wasm downloads; a slow,
       barely-there pulse says "working" without becoming a spinner competing for attention. */
    @keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
    #boot img { animation: breathe 2.4s ease-in-out infinite; }
    /* Someone who asked the OS for less motion gets a still logo, not a slower one. */
    @media (prefers-reduced-motion: reduce) { #boot img { animation: none; opacity: .9 } }
    #boot.err { color: #f85149; }
    /* On the error path the logo stops breathing: nothing is working any more. */
    #boot.err img { animation: none; opacity: .35; }
  </style>
</head>

    <span id="boot-text">Gizmo Engine yükleniyor… (WebGPU gerektirir)
Loading Gizmo Engine… (requires WebGPU)</span>
  </div>
  <script type="module">
    const boot = document.getElementById('boot');
    const fail = (msg) => {
      // Sadece ilk hata gösterilir; sonrakiler bastırılır (panik ardıl olayları).
      if (boot.classList.contains('err')) return;
      boot.classList.add('err');
      // The TEXT node, not the div: `boot.textContent = …` would take the logo out with it.
      document.getElementById('boot-text').textContent =
        'Başlatılamadı. / Failed to start.\n' + msg +
        '\n\nWebGPU destekli güncel bir tarayıcı (Chrome/Edge) gerekir.' +
        '\nA current WebGPU-capable browser (Chrome/Edge) is required.';
    };

    // Motorun async WebGPU init'i wasm-bindgen start() DÖNDÜKTEN SONRA,
    // spawn_local içinde koşar ve başarısızlıkta PANİKLER (adapter/device yok).
    // O panik burada bir uncaught 'error'/'unhandledrejection' olarak yüzer —
    // await init()'in try/catch'i onu YAKALAMAZ. Bu yüzden global dinleyiciler:
    window.addEventListener('error', (e) => fail(e.message || String(e.error || e)));
    window.addEventListener('unhandledrejection', (e) => fail(String(e.reason)));

    if (!navigator.gpu) {
      fail('Tarayıcıda WebGPU (navigator.gpu) yok. / No WebGPU (navigator.gpu) in this browser.');
    } else {
      try {
        const { default: init } = await import('./pkg/demo_web.js');
        await init();
        // init() çözülmesi renderer'ın HAZIR olduğu anlamına GELMEZ (async GPU
        // init hâlâ sürüyor olabilir). Canvas motor tarafından eklenene kadar
        // "yükleniyor" mesajını tut; canvas belirince ilk kare geldi demektir.
        const start = performance.now();
        const waitCanvas = () => {
          if (boot.classList.contains('err')) return; // hata baskın
          const cv = document.querySelector('canvas');
          if (cv && cv.width > 1 && cv.height > 1) {
            boot.remove();
          } else if (performance.now() - start > 15000) {
            fail('Render 15 sn içinde başlamadı (WebGPU adapter alınamadı olabilir).' +
              '\nRendering did not start within 15 s (the WebGPU adapter may be unavailable).');
          } else {
            requestAnimationFrame(waitCanvas);
          }
        };
        requestAnimationFrame(waitCanvas);
      } catch (e) {
        fail(String(e));
      }
    }
  </script>
