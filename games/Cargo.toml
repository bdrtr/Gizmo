[package]
name = "games"
description = "Games shared by the desktop demos (demo/) and the browser build (demo-web/): one game, two hosts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# What the games need and nothing more, so the browser build can take this crate as it is. The
# desktop `demo` crate adds its own features on top; cargo unifies them.
gizmo = { package = "gizmo-engine", path = "../crates/gizmo", default-features = false, features = [
    "window",
    "render",
    "physics",
    "physics-dynamics",
    # sinama's cloth and soft bodies; the browser build has them too.
    "physics-soft",
    "ui",
    # nisanci's shots and hits are synthesised blips; the browser build has audio too.
    "audio",
] }

# `dunya --bench`'s one async call (a headless renderer); the desktop's only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0"
