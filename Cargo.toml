[workspace]
resolver = "2"
members = [
    "crates/*",
    "server",
    "demo",
    "demo-web",
    "cradle",
]
# Rakip motorla kıyas düzeneği. Üye DEĞİL: `rapier3d` motorun bağımlılık grafiğine
# girmesin diye. `benchmarks/vs-rapier` içine girip `cargo run --release` ile koşulur.
exclude = ["benchmarks"]

[workspace.package]
version = "0.10.0"
edition = "2021"
# Minimum Supported Rust Version. Floor is set by `transform-gizmo-egui 0.10` (1.96); the
# egui 0.36 family and `bevy_ecs` sit just under it at 1.95, and wgpu 30 at 1.87. Measured
# across every non-workspace dependency's declared `rust-version`, not guessed — the previous
# floor of 1.92 came from egui 0.34 the same way. Enforced by the `msrv` CI job, which now
# READS this line instead of pinning a copy of it. Raising this is a semver-minor.
rust-version = "1.96"
authors = ["Bedir"]
description = "A custom ECS and physics engine aimed for realistic simulations."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bdrtr/Gizmo"
keywords = ["game-engine", "ecs", "physics", "simulation", "gamedev"]
categories = ["game-engines"]

# Bağımlılıkları tek bir yerden yönetmek için (Inherited Dependencies)
[workspace.dependencies]
winit = "0.30"
mimalloc = { version = "0.1", default-features = false }
proptest = "1"

# Dev derleme profili. Demo binary'leri wgpu/egui'nin TAMAMINI statik linkliyor ve
# tam DWARF debug bilgisi her ~500MB binary'nin ~yarısıydı; ~40 demo × her yeniden-derlemenin
# target/debug/deps'te biriken eski kopyası target/'ı 600G+'a şişirmişti (ve dev binary'lerinde
# linker'ı çökertiyordu). Aşağıdaki iki ayar SADECE debug bilgisini etkiler; kod üretimini
# (yani ÇALIŞMA HIZINI) belirleyen opt-level'a DOKUNULMADI → runtime performansı birebir aynı,
# derleme/linkleme ise biraz daha hızlı. Tek ödün: debugger'da değişken-seviyesi inceleme.
[profile.release]
# Cross-crate inlining matters a lot here: the hot path is small functions calling across
# gizmo-math -> gizmo-physics-core -> gizmo-physics-rigid thousands of times per frame, and
# cargo's defaults (lto = false, codegen-units = 16) leave that on the table. Measured on this
# machine with the local override lifted: codegen-units = 1 alone is -8.4% and -7.5% on
# full_step_mixed/128 and /512, -5..-7% on broadphase, -20% on the dense-contact scene.
#
# CURRENTLY INERT EVERYWHERE, and that is worth knowing before trusting it. rustflags are
# appended after profile-derived flags and rustc takes the last `-C`, so the
# `rustflags = ["-C", "codegen-units=4", "-C", "lto=off"]` in `.cargo/config.toml` wins — and
# that file is checked into git, so CI inherits it too (both release-profile jobs, `determinism`
# and `benchmarks`, run on ubuntu-latest). Cargo also ignores `[profile.*]` in a dependency's
# manifest, so someone depending on `gizmo-engine` from crates.io never sees this either; they
# have to set it in their own workspace.
#
# What this section IS: the right value, recorded with its measurement, ready for the day the
# machine override is narrowed. Making it effective here means dropping the `codegen-units=4`
# token from that rustflags line — which is the machine's documented RAM guard, so it is not a
# change to make silently. Evidence so far: the physics bench builds fine at codegen-units = 1
# (31.5 s), and a gizmo-renderer build peaked at 2.78 GB across four concurrent rustc against
# ~13 GB of RAM — but its heaviest dependencies (wgpu, naga) were cached, so that number does
# not settle the demo-binary case.
#
# LTO is deliberately NOT set. `lto = "thin"` was measured on top of codegen-units = 1 and added
# nothing on this workload: full_step_mixed/128 -0.07% and /512 +2.7%, neither significant, and
# solver_settled_stack/48 came out +18%. It costs build time for no measured gain here. It may
# still pay for a whole game binary linking far more crates than the physics bench does — that
# needs a measurement this machine cannot safely run, since lifting the RAM override to link
# wgpu and egui under LTO is what the override exists to prevent.
codegen-units = 1

[profile.dev]
# Makinenin RAM koruması, ARTIK BURADA. Eskiden `.cargo/config.toml`'daki
# `rustflags = ["-C", "codegen-units=4", ...]` ile geliyordu; o satır bütün profillere birden
# uygulandığı için release profilinin `codegen-units = 1`'ini de eziyordu (rustflags profil
# bayraklarından SONRA ekleniyor, rustc son `-C`'yi alır). Token oradan kaldırılırken bu
# değerin dev tarafında AYNEN korunması gerekiyordu: cargo'nun dev varsayılanı 256'dır, yani
# token'ı sadece silmek korumayı kaldırmakla kalmaz, dev'i eskisinden daha paralel bir
# codegen'e taşırdı — korumanın tam olarak engellemek için var olduğu yön.
codegen-units = 4
# Backtrace/panik için dosya:satır çözümünü korur, değişken-seviyesi DWARF'ı atar (binary'nin
# en büyük parçası). Bunu bırakmak derlemeyi hafif hızlandırır.
debug = "line-tables-only"
# Debug bilgisini binary'ye gömmek yerine ayrı .o dosyalarında tut → linklenen binary çok daha
# küçük ve linkleme daha hızlı (Linux). (Not: binary'i başka yere taşırsan .o'lar gitmediği için
# sembolleri kaybeder — yerinde çalıştırmada sorun yok.)
split-debuginfo = "unpacked"
